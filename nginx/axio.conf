server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.com;

    ssl_certificate     /etc/ssl/certs/axio.crt;
    ssl_certificate_key /etc/ssl/private/axio.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Serve built frontend
    root /var/www/axio;
    index index.html;

    # Upload size limit — match backend MAX_UPLOAD_MB
    client_max_body_size 55M;

    # API reverse proxy
    location ~ ^/(upload|train|predict|chat|export|session|health) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # allow time for model training
        proxy_send_timeout 180s;
    }

    # SPA fallback — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
